[project]
name = "shipcube-mcp"
version = "0.2.0"
description = "ShipCube MCP server (stub tools over the control-plane API)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "starlette",
    "uvicorn>=0.30",
    "shipcube-api",
]

[project.optional-dependencies]
# The real data layer (Kunal-Shahi/shipcube-data PR #1). Without it the data_* tools use a stub.
data = ["shipcube-data[duckdb,postgres,http]"]
# The load estimator behind estimate_load (see services/api/pyproject.toml).
estimator = ["shipcube-api[estimator]"]

[project.scripts]
shipcube-mcp = "shipcube_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
shipcube-api = { path = "../api", editable = true }
shipcube-data = { git = "https://github.com/Kunal-Shahi/shipcube-data", rev = "14be85b7e51981597894392578d6e37a90111878" }  # PR #9 (segment and URL-secret hardening, issue #8); repin to its merge commit
shipcube-placement = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "fefbe7df1a5d3b686f40f5075a6754c68fe690ed", subdirectory = "packages/placement" }
shipcube-profiler = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "fefbe7df1a5d3b686f40f5075a6754c68fe690ed", subdirectory = "packages/profiler" }
shipcube-classifier = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "fefbe7df1a5d3b686f40f5075a6754c68fe690ed", subdirectory = "ml/workload-classifier" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
