[project]
name = "shipcube-mcp"
version = "0.2.0"
description = "ShipCube MCP server (stub tools over the control-plane API)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "starlette",
    "uvicorn>=0.30",
    "shipcube-api",
]

[project.optional-dependencies]
# The real data layer (Kunal-Shahi/shipcube-data PR #1). Without it the data_* tools use a stub.
data = ["shipcube-data[duckdb,postgres,http]"]
# The load estimator behind estimate_load (see services/api/pyproject.toml).
estimator = ["shipcube-api[estimator]"]

[project.scripts]
shipcube-mcp = "shipcube_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
shipcube-api = { path = "../api", editable = true }
shipcube-data = { git = "https://github.com/Kunal-Shahi/shipcube-data", rev = "358bf2274e031db555a3f02d569a591141ef221f" }  # main after PRs #11-#13 (week/quarter, L2 stages, governed SQL, pre-aggregations)n after PRs #9 and #10 (issue #8)
shipcube-placement = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "d92d22fdc49f3c6f6e665fe5a460d57e79e4770a", subdirectory = "packages/placement" }
shipcube-profiler = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "d92d22fdc49f3c6f6e665fe5a460d57e79e4770a", subdirectory = "packages/profiler" }
shipcube-classifier = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "d92d22fdc49f3c6f6e665fe5a460d57e79e4770a", subdirectory = "ml/workload-classifier" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
