[project]
name = "shipcube-mcp"
version = "0.2.0"
description = "ShipCube MCP server (stub tools over the control-plane API)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "starlette",
    "uvicorn>=0.30",
    "shipcube-api",
]

[project.scripts]
shipcube-mcp = "shipcube_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
shipcube-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
