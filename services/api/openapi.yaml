openapi: 3.1.0
info:
  title: ShipCube control-plane API
  version: v1
  description: |
    The contract between the MCP server, the web console and the control plane.
    Long-running work (estimates, deploys, deletes) returns 202 with an Operation,
    modelled on google.longrunning.Operation (AIP-151). Mutating POST/DELETE calls
    accept an Idempotency-Key header (draft-ietf-httpapi-idempotency-key-header).
servers:
  - url: https://api.shipcube.dev
  - url: http://127.0.0.1:8080
security:
  - bearer: []
paths:
  /v1/me:
    get:
      summary: Current user, workspace, GCP targets, limits and the calling token's scopes (any valid token)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
  /v1/uploads:
    post:
      summary: Create a signed URL for a source tarball upload
      requestBody: { content: { application/json: { schema: { type: object, properties: { content_type: { type: string } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
  /v1/estimates:
    post:
      summary: Start a load estimate (profile + classify + price)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: '#/components/schemas/Source' }
                app: { type: string }
                expected_users: { type: integer }
                schedule: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/apps:
    get:
      summary: List apps
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { apps: { type: array, items: { $ref: '#/components/schemas/AppSummary' } } } } } }
  /v1/apps/{app}:
    parameters: [{ $ref: '#/components/parameters/App' }]
    get:
      summary: Get one app
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/App' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Soft-delete an app (always awaits approval; restorable for 7 days)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /v1/apps/{app}/deployments:
    parameters: [{ $ref: '#/components/parameters/App' }]
    post:
      summary: Build and deploy a new revision
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: '#/components/schemas/Source' }
                estimate_id: { type: string }
                tier: { type: string, enum: [T0, T1, T2, T3, T4] }
                target: { type: string, description: GCP target id from /v1/me }
                region: { type: string, default: us-central1 }
                env: { type: object, additionalProperties: { type: string } }
                secrets: { type: object, additionalProperties: { type: string }, description: ENV -> secret name }
                caps: { $ref: '#/components/schemas/Caps' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/operations/{id}:
    get:
      summary: Poll an operation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } }
  /v1/operations/{id}/cancel:
    post:
      summary: Cancel an operation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } }
  /v1/tokens:
    get:
      summary: The caller's active API tokens (console session only; a PAT gets 403)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenList' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a PAT (console session only). The secret is in the response once; only its HMAC is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scopes: { type: array, minItems: 1, items: { type: string } }
                days: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '201':
          description: Created (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: '#/components/schemas/Token' }
                  secret: { type: string, description: 'sc_pat_<id>_<secret>, shown once' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/tokens/{token_id}:
    delete:
      summary: Revoke a token (console session only; own tokens, or any in the workspace for admins)
      parameters: [{ name: token_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/operations/{id}/approve:
    post:
      summary: Approve an operation that is awaiting_approval (console session only; a PAT gets 403)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { comment: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/operations/{id}/reject:
    post:
      summary: Reject an operation that is awaiting_approval (console session only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { comment: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } }
  /v1/apps/{app}/logs:
    parameters: [{ $ref: '#/components/parameters/App' }]
    get:
      summary: Recent logs
      parameters:
        - { name: severity, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
  /v1/apps/{app}/metrics:
    parameters: [{ $ref: '#/components/parameters/App' }]
    get:
      summary: Health, cost and cap usage
      parameters: [{ name: window, in: query, schema: { type: string, enum: [15m, 1h, 24h, 7d, 30d] } }]
      responses:
        '200': { description: OK }
  /v1/apps/{app}/caps:
    parameters: [{ $ref: '#/components/parameters/App' }]
    patch:
      summary: Update caps (merge). A raise above the workspace default waits for approval and returns an Operation.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Caps' } } } }
      responses:
        '200': { description: OK }
  /v1/apps/{app}/access:
    parameters: [{ $ref: '#/components/parameters/App' }]
    patch:
      summary: Add and remove access grants; returns the full list
      description: 'Removals and user/group grants apply at once. domain: grants wait for approval and come back as an Operation.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add: { type: array, items: { type: object, required: [principal], properties: { principal: { type: string }, role: { type: string, enum: [viewer, editor] } } } }
                remove: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: array, items: { type: object } }
                  operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
  /v1/apps/{app}/restore:
    parameters: [{ $ref: '#/components/parameters/App' }]
    post:
      summary: Restore a soft-deleted app (console session only, within 7 days)
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/apps/{app}/rollbacks:
    parameters: [{ $ref: '#/components/parameters/App' }]
    post:
      summary: Send all traffic back to an earlier revision ("previous" by default)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { to: { type: string, default: previous, description: '"previous" or a revision name' } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/apps/{app}/ai:
    parameters: [{ $ref: '#/components/parameters/App' }]
    put:
      summary: Set the AI gateway provider for an app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [meta, openai_compatible, openai, anthropic] }
                model: { type: string }
                key_secret: { type: string }
                base_url: { type: string }
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Personal access token sc_pat_<id>_<secret> in phase 1 (stored as HMAC-SHA-256 with a pepper; see
        docs/research/database-design.md api_tokens). Scopes: apps:read, apps:deploy, access:write, caps:write,
        secrets:write, data:read, data:migrate, data:raw. OAuth 2.1 access tokens later. Console sessions (not PATs)
        are the only callers allowed to approve, reject or restore.
  parameters:
    App: { name: app, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 64 } }
  responses:
    Accepted:
      description: Operation started (or the existing operation for a repeated Idempotency-Key)
      headers:
        Location: { schema: { type: string } }
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
    Error:
      description: Error
      content:
        application/json:
          schema: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } } }
  schemas:
    Token:
      type: object
      required: [id, name, prefix, scopes, created_at, expires_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: 'sc_pat_<id>, safe to show' }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens: { type: array, items: { $ref: '#/components/schemas/Token' } }
    Source:
      oneOf:
        - { type: object, required: [kind, upload_id], properties: { kind: { const: upload }, upload_id: { type: string } } }
        - { type: object, required: [kind, url], properties: { kind: { const: git }, url: { type: string }, ref: { type: string }, subdir: { type: string } } }
        - { type: object, required: [kind, uri], properties: { kind: { const: image }, uri: { type: string } } }
        - type: object
          required: [kind, files]
          description: Up to 100 files and 2 MB of content in total
          properties:
            kind: { const: inline }
            files: { type: array, minItems: 1, maxItems: 100, items: { type: object, properties: { path: { type: string }, content: { type: string }, encoding: { type: string, enum: [utf-8, base64] } } } }
    Caps:
      type: object
      properties:
        max_instances: { type: integer, minimum: 0, maximum: 10 }
        concurrency: { type: integer, minimum: 1, maximum: 1000 }
        requests_per_minute: { type: integer, minimum: 1 }
        monthly_spend_usd: { type: number, minimum: 0 }
        cpu: { type: string, enum: ['0.5', '1', '2', '4'] }
        memory: { type: string }
        timeout_s: { type: integer, minimum: 1, maximum: 3600 }
    Operation:
      type: object
      required: [id, kind, status, done, progress, poll_after_s]
      properties:
        id: { type: string }
        kind: { type: string, enum: [estimate, deploy, rollback, delete, restore, purge, set_caps, set_access] }
        app: { type: [string, 'null'] }
        status: { type: string, enum: [awaiting_approval, queued, running, succeeded, failed, cancelled], description: 'A rejected or expired (72 h) approval ends as cancelled with error.code approval_rejected or approval_expired' }
        done: { type: boolean }
        progress:
          type: object
          properties: { step: { type: string }, completed_steps: { type: integer }, total_steps: { type: integer }, message: { type: string } }
        steps: { type: array, items: { type: object, properties: { name: { type: string }, status: { type: string } } } }
        result: { description: 'Kind-specific result, present when status is succeeded. For estimate, see EstimateResult.' }
        error: { type: [object, 'null'], properties: { code: { type: string }, message: { type: string } } }
        approval_url: { type: [string, 'null'], description: Set while awaiting_approval; a human approves in the console }
        approval_reasons: { type: array, items: { type: string } }
        approval_actions: { type: array, items: { type: string, enum: [first_linked_deploy, cap_raise, domain_grant, delete_app] } }
        approval_expires_at: { type: [string, 'null'], format: date-time }
        poll_after_s: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Upload:
      type: object
      properties:
        upload_id: { type: string }
        method: { const: PUT }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        max_bytes: { type: integer }
        expires_at: { type: string, format: date-time }
    Me:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        workspace: { type: object, properties: { id: { type: string }, name: { type: string } } }
        gcp_targets:
          type: array
          items: { type: object, properties: { id: { type: string }, project: { type: string }, kind: { type: string, enum: [shipcube, linked] }, default: { type: boolean } } }
        limits: { type: object, properties: { max_apps: { type: integer }, monthly_spend_usd: { type: number } } }
        token: { type: object, properties: { id: { type: string }, scopes: { type: array, items: { type: string } }, expires_at: { type: integer } } }
    AppSummary:
      type: object
      properties: { name: { type: string }, url: { type: string }, tier: { type: string }, status: { type: string }, updated_at: { type: string } }
    App:
      allOf:
        - $ref: '#/components/schemas/AppSummary'
        - type: object
          properties:
            target: { type: string }
            region: { type: string }
            revision: { type: string }
            image: { type: string }
            caps: { $ref: '#/components/schemas/Caps' }
            access: { type: array, items: { type: object, properties: { principal: { type: string }, role: { type: string }, granted_at: { type: string } } } }
            ai: { type: object, properties: { provider: { type: string }, model: { type: string }, key_secret: { type: [string, 'null'] } } }
            deleted_at: { type: [string, 'null'] }
            revisions: { type: array, items: { type: object, properties: { revision: { type: string }, status: { type: string }, created_at: { type: string } } } }
            runtime: { type: [object, 'null'], description: Live Cloud Run state }
            restorable_until: { type: [string, 'null'] }
    EstimateResult:
      type: object
      description: The classifier fills the numbers; Muse Spark (or rules, as a fallback) fills reasoning, alternatives and recommended_caps.
      properties:
        estimate_id: { type: string }
        workload_class: { type: string }
        confidence: { type: number }
        tier: { type: string }
        resources: { type: object }
        monthly_cost_usd: { type: object }
        profile: { type: object }
        reasoning: { type: string }
        alternatives: { type: array, items: { type: object, properties: { tier: { type: string }, why_not: { type: string } } } }
        recommended_caps: { type: object }
        explained_by: { type: string, enum: [muse-spark, rules] }
