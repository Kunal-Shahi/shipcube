[project]
name = "shipcube-api"
version = "0.1.0"
description = "ShipCube control-plane API (skeleton, mock state)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-auth>=2.30",
    "cryptography>=42",
    "google-cloud-storage>=2.17",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# estimate_load engine from the load-estimator workstream (PR #7). Without it, estimates fail with
# estimator_unavailable instead of returning made-up numbers.
estimator = ["shipcube-placement", "shipcube-profiler", "shipcube-classifier"]
# The console's Data page (/v1/data/*) from Kunal-Shahi/shipcube-data. Without it those routes answer 501.
data = ["shipcube-data[http,duckdb,postgres]"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
shipcube-data = { git = "https://github.com/Kunal-Shahi/shipcube-data", rev = "358bf2274e031db555a3f02d569a591141ef221f" }  # main after PRs #11-#13 (week/quarter, L2 stages, governed SQL, pre-aggregations)n after PRs #9 and #10 (issue #8)
shipcube-placement = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "d92d22fdc49f3c6f6e665fe5a460d57e79e4770a", subdirectory = "packages/placement" }
shipcube-profiler = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "d92d22fdc49f3c6f6e665fe5a460d57e79e4770a", subdirectory = "packages/profiler" }
shipcube-classifier = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "d92d22fdc49f3c6f6e665fe5a460d57e79e4770a", subdirectory = "ml/workload-classifier" }
