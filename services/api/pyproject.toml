[project]
name = "shipcube-api"
version = "0.1.0"
description = "ShipCube control-plane API (skeleton, mock state)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-auth>=2.30",
    "google-cloud-storage>=2.17",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# estimate_load engine from the load-estimator workstream (PR #7). Without it, estimates fail with
# estimator_unavailable instead of returning made-up numbers.
estimator = ["shipcube-placement", "shipcube-profiler", "shipcube-classifier"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
shipcube-placement = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "fefbe7df1a5d3b686f40f5075a6754c68fe690ed", subdirectory = "packages/placement" }
shipcube-profiler = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "fefbe7df1a5d3b686f40f5075a6754c68fe690ed", subdirectory = "packages/profiler" }
shipcube-classifier = { git = "https://github.com/Kunal-Shahi/shipcube", rev = "fefbe7df1a5d3b686f40f5075a6754c68fe690ed", subdirectory = "ml/workload-classifier" }
