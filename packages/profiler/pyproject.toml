[project]
name = "shipcube-profiler"
version = "0.1.0"
description = "ShipCube profiler: run an app on sample input, measure CPU/memory/I/O/network, map to classifier features"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["psutil>=6.0", "shipcube-classifier[gcp]"]

[project.optional-dependencies]
test = ["pytest>=8", "flask>=3.0"]

[tool.uv.sources]
shipcube-classifier = { path = "../../ml/workload-classifier", editable = true }

[dependency-groups]
# Installed by `uv sync` (CI). flask runs the dashboard sample app in the tests.
dev = ["pytest>=8", "flask>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcube_profiler"]
