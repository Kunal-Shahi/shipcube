[project]
name = "shipcube-monitor"
version = "0.1.0"
description = "ShipCube monitoring provider: Cloud Monitoring metrics, Cloud Logging entries, cost estimate, alerts"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Application Default Credentials for the real provider. Mock mode needs nothing.
gcp = ["google-auth[requests]>=2.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
