[project]
name = "shipcube-placement"
version = "0.1.0"
description = "ShipCube load estimation: estimate(source, hints) -> EstimateResult (tier, sizing, cost, caps, Muse Spark reasoning)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "shipcube-profiler",
  "shipcube-classifier",
]

[project.optional-dependencies]
test = ["pytest>=8", "flask>=3.0"]

[tool.uv.sources]
shipcube-classifier = { path = "../../ml/workload-classifier", editable = true }
shipcube-profiler = { path = "../profiler", editable = true }

[dependency-groups]
# Installed by `uv sync` (CI). flask runs the dashboard sample app in the tests.
dev = ["pytest>=8", "flask>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcube_placement"]
