name: deploy

# Manual only. Authenticates to GCP with Workload Identity Federation (deploy/wif.sh); no keys.
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build new images on Cloud Build first
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: deploy/deploy.sh ${{ inputs.build && '' || '--no-build' }}
        env:
          DATA_WORKSPACE: ${{ vars.SHIPCUBE_DATA_WORKSPACE }}
          PLATFORM_ADMINS: ${{ vars.SHIPCUBE_PLATFORM_ADMINS }}
          CONSOLE_ORIGINS: ${{ vars.SHIPCUBE_CONSOLE_ORIGINS }}
          # `terraform output -json profiler`; not secret, stored as a repository variable.
          PROFILER_ENV_JSON: ${{ vars.SHIPCUBE_PROFILER_ENV_JSON }}
