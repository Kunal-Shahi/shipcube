name: ci / web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Check for the console
        id: present
        working-directory: .
        run: echo "present=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.present.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.present.outputs.present == 'true'
        run: npm ci
      - if: steps.present.outputs.present == 'true'
        run: npm run lint
      - if: steps.present.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
