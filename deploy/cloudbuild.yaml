# Builds ShipCube's three images in parallel on Cloud Build (no local Docker).
# Submitted by deploy/deploy.sh with the repo root as the build context.
substitutions:
  _IMAGES: asia-south1-docker.pkg.dev/shipcube-control-ks/platform
  _TAG: dev
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
steps:
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-f", "deploy/web.Dockerfile", "-t", "${_IMAGES}/console:${_TAG}", "."]
  - id: mcp
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-f", "deploy/mcp.Dockerfile", "-t", "${_IMAGES}/mcp:${_TAG}", "."]
  - id: gateway
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_IMAGES}/gateway:${_TAG}", "services/gateway"]
images:
  - ${_IMAGES}/console:${_TAG}
  - ${_IMAGES}/mcp:${_TAG}
  - ${_IMAGES}/gateway:${_TAG}
timeout: 1200s
