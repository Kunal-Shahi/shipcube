[project]
name = "shipcube-migrate"
version = "0.1.0"
description = "Versioned SQL migrations for ShipCube's Cloud SQL Postgres"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
shipcube-migrate = "shipcube_migrate.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipcube_migrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
