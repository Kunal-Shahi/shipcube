# shipcube-gateway: the AI gateway (services/gateway). Rendered by deploy/deploy.sh. Public at the
# Cloud Run level: it verifies each app's Google ID token itself (audience = its own URL).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shipcube-gateway
  labels: {managed-by: shipcube-platform}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels: {managed-by: shipcube-platform, release: "${TAG}"}
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ${SA_GATEWAY}
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - name: gateway
          image: ${IMAGE_GATEWAY}
          ports: [{name: http1, containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 256Mi}}
          env:
            - {name: GATEWAY_AUDIENCE, value: "${GATEWAY_URL}"}
            - {name: GATEWAY_REGISTRY_FILE, value: /etc/shipcube/registry/registry.json}
            - {name: META_SECRET_REF, value: "projects/${PROJECT}/secrets/meta-api-key/versions/${META_KEY_VERSION}"}
            - {name: GOOGLE_CLOUD_PROJECT, value: "${PROJECT}"}
          volumeMounts:
            - {name: registry, mountPath: /etc/shipcube/registry}
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
      volumes:
        - name: registry
          secret:
            secretName: gateway-registry
            items: [{key: latest, path: registry.json}]
