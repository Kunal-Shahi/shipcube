# shipcube-console: the web console (apps/web). Rendered by deploy/deploy.sh. Public: sign-in
# happens in the app (Identity Platform, Google provider).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shipcube-console
  labels: {managed-by: shipcube-platform}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels: {managed-by: shipcube-platform, release: "${TAG}"}
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ${SA_WEB}
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: console
          image: ${IMAGE_CONSOLE}
          ports: [{name: http1, containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 512Mi}}
          env:
            - {name: SHIPCUBE_API_URL, value: "${MCP_URL}"}
            - {name: SHIPCUBE_MCP_URL, value: "${MCP_URL}/mcp"}
            - {name: IDENTITY_PLATFORM_PROJECT, value: "${PROJECT}"}
            - {name: FIREBASE_WEB_API_KEY, value: "${FIREBASE_WEB_API_KEY}"}
            - {name: GOOGLE_CLOUD_PROJECT, value: "${PROJECT}"}
          startupProbe:
            httpGet: {path: /api/healthz, port: 8080}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/healthz, port: 8080}
            periodSeconds: 30
