# shipcube-mcp: MCP server + control-plane API, one process. Rendered by deploy/deploy.sh.
# Public at the Cloud Run level: MCP clients and the console authenticate to the API itself.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shipcube-mcp
  labels: {managed-by: shipcube-platform}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels: {managed-by: shipcube-platform, release: "${TAG}"}
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: ${CLOUDSQL_INSTANCES}
    spec:
      serviceAccountName: ${SA_API}
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - name: app
          image: ${IMAGE_API}
          ports: [{name: http1, containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 1Gi}}
          env:
            - {name: SHIPCUBE_DATABASE_URL, value: "postgresql://sc-api%40${PROJECT}.iam@/shipcube?host=/cloudsql/${SQL_INSTANCE}"}
            - {name: SHIPCUBE_DB_IAM_AUTH, value: "1"}
            - {name: SHIPCUBE_DB_SET_ROLE, value: "0"}
            - {name: SHIPCUBE_DB_POOL, value: "5"}
            - {name: SHIPCUBE_EMBEDDED_WORKER, value: "0"}
            - {name: SHIPCUBE_IDP_PROJECT, value: "${PROJECT}"}
            - {name: SHIPCUBE_CONTROL_PROJECT, value: "${PROJECT}"}
            - {name: SHIPCUBE_APPS_PROJECT, value: "${APPS_PROJECT}"}
            - {name: SHIPCUBE_REGION, value: "${REGION}"}
            - {name: SHIPCUBE_HOSTED_DEPLOYER_SA, value: "${SA_HOSTED_DEPLOYER}"}
            - {name: SHIPCUBE_CONSOLE_URL, value: "${CONSOLE_URL}"}
            # Returned to agents by ai_config; unset, it falls back to http://localhost:8090 (#41).
            - {name: SHIPCUBE_AI_GATEWAY_URL, value: "${GATEWAY_URL}"}
            - {name: SHIPCUBE_DATA_WORKSPACE, value: "${DATA_WORKSPACE}"}
            # Warehouse credentials live in this project's Secret Manager (ws-<id>-… secrets); unset, every warehouse with a password is refused.
            - {name: SHIPCUBE_DATA_SECRET_PROJECT, value: "${PROJECT}"}
            - {name: SHIPCUBE_DATA_ALLOWED_DB_HOSTS, value: "${DATA_ALLOWED_DB_HOSTS}"}
            - {name: SHIPCUBE_MONITOR, value: gcp}
            - {name: ALLOWED_HOSTS, value: "${MCP_HOST}"}
            - {name: GOOGLE_CLOUD_PROJECT, value: "${PROJECT}"}
            - name: SHIPCUBE_TOKEN_PEPPER
              valueFrom: {secretKeyRef: {name: token-hmac-pepper, key: "${PEPPER_VERSION}"}}
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
